<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) .2s both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x=".5" y=".5" width="799" height="459" rx="20" fill="#0b1220" stroke="#24324f"/>
  <text x="40" y="52" class="mono" font-size="19" fill="#f87171" letter-spacing="1.5">DEEP LEARNING · MEDICAL IMAGING</text>
  <text x="40" y="96" class="sans" font-size="34" font-weight="800" fill="#f8fafc">Cardiomegaly Detection</text>
  <text x="40" y="130" class="sans" font-size="22" fill="#94a3b8">A CNN that flags an enlarged heart on chest X-rays.</text>

  <!-- metric tiles -->
  <g class="sans" text-anchor="middle">
    <rect x="40" y="156" width="165" height="96" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="122" y="208" font-size="36" font-weight="800" fill="#38bdf8">0.906</text>
    <text x="122" y="236" font-size="17" fill="#94a3b8">ROC AUC</text>
    <rect x="225" y="156" width="165" height="96" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="307" y="208" font-size="36" font-weight="800" fill="#e2e8f0">79.8%</text>
    <text x="307" y="236" font-size="17" fill="#94a3b8">accuracy</text>
    <rect x="410" y="156" width="165" height="96" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="492" y="208" font-size="36" font-weight="800" fill="#34d399">0.86</text>
    <text x="492" y="236" font-size="17" fill="#94a3b8">precision</text>
    <rect x="595" y="156" width="165" height="96" rx="12" fill="#3b1518" stroke="#7f1d1d"/>
    <text x="677" y="208" font-size="36" font-weight="800" fill="#fca5a5">0.71</text>
    <text x="677" y="236" font-size="17" fill="#fecaca">recall</text>
  </g>

  <!-- recall vs clinical bar -->
  <g class="sans" font-size="19">
    <text x="40" y="292" fill="#e2e8f0">Recall vs. clinical need</text>
    <rect x="40" y="306" width="720" height="22" rx="6" fill="#1e293b"/>
    <rect x="40" y="306" width="511" height="22" rx="6" fill="#f87171" class="bar"/>
    <line x1="688" y1="298" x2="688" y2="336" stroke="#34d399" stroke-width="3"/>
    <text x="682" y="292" text-anchor="end" fill="#6ee7b7" font-size="16">0.90 needed</text>
    <text x="40" y="356" fill="#94a3b8" font-size="17">An honest result: a research baseline, not a clinical tool.</text>
  </g>

  <line x1="40" y1="374" x2="760" y2="374" stroke="#1e293b"/>
  <text x="40" y="420" class="mono" font-size="19" fill="#64748b">5,447 X-rays · 4-block CNN · TensorFlow</text>
</svg>
