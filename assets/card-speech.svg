<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    
    @keyframes appear{to{opacity:1}}
    .playhead{animation:play 6s linear infinite}
    @keyframes play{from{transform:translateX(0)}to{transform:translateX(500px)}}
  </style>
  <rect x=".5" y=".5" width="799" height="459" rx="20" fill="#0b1220" stroke="#24324f"/>
  <text x="40" y="52" class="mono" font-size="19" fill="#a78bfa" letter-spacing="1.5">SPEECH AI · NLP PIPELINE</text>
  <text x="40" y="96" class="sans" font-size="34" font-weight="800" fill="#f8fafc">Call Center Speech Analytics</text>
  <text x="40" y="130" class="sans" font-size="22" fill="#94a3b8">Who said what, and how they felt, from raw audio.</text>

  <!-- lane labels -->
  <g class="sans">
    <text x="40" y="196" font-size="17" fill="#64748b" class="mono">Speaker A →</text>
    <text x="40" y="218" font-size="21" font-weight="700" fill="#e2e8f0">Maria (agent)</text>
    <text x="40" y="266" font-size="17" fill="#64748b" class="mono">Speaker B →</text>
    <text x="40" y="288" font-size="21" font-weight="700" fill="#e2e8f0">Customer</text>
  </g>

  <!-- lanes -->
  <rect x="260" y="184" width="500" height="40" rx="8" fill="#0f172a"/>
  <rect x="260" y="254" width="500" height="40" rx="8" fill="#0f172a"/>
  <g>
    <rect class="s" style="animation-delay:.1s"  x="264" y="190" width="70"  height="28" rx="5" fill="#34d399"/>
    <rect class="s" style="animation-delay:.3s"  x="338" y="260" width="96"  height="28" rx="5" fill="#f87171"/>
    <rect class="s" style="animation-delay:.5s"  x="438" y="190" width="58"  height="28" rx="5" fill="#64748b"/>
    <rect class="s" style="animation-delay:.7s"  x="500" y="260" width="72"  height="28" rx="5" fill="#f87171"/>
    <rect class="s" style="animation-delay:.9s"  x="576" y="190" width="84"  height="28" rx="5" fill="#34d399"/>
    <rect class="s" style="animation-delay:1.1s" x="664" y="260" width="56"  height="28" rx="5" fill="#64748b"/>
    <rect class="s" style="animation-delay:1.3s" x="722" y="260" width="34"  height="28" rx="5" fill="#34d399"/>
  </g>
  <g class="playhead"><line x1="260" y1="176" x2="260" y2="302" stroke="#e2e8f0" stroke-width="2" opacity=".7"/></g>

  <!-- axis + legend -->
  <g class="mono" font-size="17" fill="#64748b">
    <text x="260" y="320">0:00</text><text x="760" y="320" text-anchor="end">4:12</text>
    <rect x="260" y="336" width="16" height="16" rx="3" fill="#34d399"/><text x="282" y="350">positive</text>
    <rect x="400" y="336" width="16" height="16" rx="3" fill="#64748b"/><text x="422" y="350">neutral</text>
    <rect x="530" y="336" width="16" height="16" rx="3" fill="#f87171"/><text x="552" y="350">negative</text>
    
  </g>

  <line x1="40" y1="384" x2="760" y2="384" stroke="#1e293b"/>
  <text x="40" y="420" class="mono" font-size="19" fill="#64748b">AssemblyAI · LLM speaker naming · spaCy</text>
</svg>
