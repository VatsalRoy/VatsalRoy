<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .num{font-size:46px;font-weight:800;letter-spacing:-1px}
    .lbl{font-size:19px;fill:#94a3b8}
    .c{opacity:0;animation:in .7s ease-out forwards}
    .c2{animation-delay:.15s}.c3{animation-delay:.3s}.c4{animation-delay:.45s}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  </style>
  <rect x=".5" y=".5" width="1199" height="149" rx="18" fill="#0b1220" stroke="#24324f"/>
  <g stroke="#1e293b"><path d="M300 30v90M600 30v90M900 30v90"/></g>
  <g class="sans" text-anchor="middle">
    <g class="c"><text x="150" y="76" class="num" fill="#38bdf8">99.2%</text><text x="150" y="108" class="lbl">production ML uptime</text></g>
    <g class="c c2"><text x="450" y="76" class="num" fill="#34d399">25%</text><text x="450" y="108" class="lbl">faster model dev · 8+ clients</text></g>
    <g class="c c3"><text x="750" y="76" class="num" fill="#a78bfa">5M+</text><text x="750" y="108" class="lbl">records via LLM pipelines</text></g>
    <g class="c c4"><text x="1050" y="76" class="num" fill="#fbbf24">25+</text><text x="1050" y="108" class="lbl">projects shipped</text></g>
  </g>
</svg>
